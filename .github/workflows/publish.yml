# Publishes ghcr.io/<owner>/bankmcp from a release tag such as v0.1.15-patch.1.
#
# Every image gets exactly two tags, both immutable: the git tag (v0.1.15-patch.1) and sha-<full commit sha>.
# There is no latest or edge tag. The job refuses to overwrite a tag that already exists in the registry, so a
# tag always names the image that was first published under it. Deploy by digest.
#
# The image is reproducible: SOURCE_DATE_EPOCH is the commit time and timestamps in the layers are rewritten to
# it, so rebuilding the same commit gives the same digest. Provenance is published as a GitHub attestation
# instead of inside the image index, which would change the digest on every build:
#   gh attestation verify oci://ghcr.io/<owner>/bankmcp@sha256:<digest> --owner <owner>
name: Publish image
on:
  push:
    tags: ["v*-patch.*"]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Gate on what ships in the image: no high or critical advisory in the runtime dependencies.
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out tags
        id: meta
        shell: bash
        env:
          GIT_TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$GIT_TAG" =~ ^v${version//./\\.}-patch\.[0-9]+$ ]]; then
            echo "::error::tag $GIT_TAG does not match package.json version $version (expected v$version-patch.N)"
            exit 1
          fi
          image="ghcr.io/${OWNER,,}/bankmcp"
          {
            echo "image=$image"
            echo "version=$GIT_TAG"
            echo "tags=$image:$GIT_TAG,$image:sha-$GITHUB_SHA"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for ref in ${TAGS//,/ }; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref already exists; tags are immutable. Cut a new -patch.N tag instead."
              exit 1
            fi
          done
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=registry,rewrite-timestamp=true
          provenance: false
          sbom: false
          no-cache: true
          pull: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
      - name: Summary
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "Pin this in the stack:"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Tags: ${TAGS//,/ , }"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST"
